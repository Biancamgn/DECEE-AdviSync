<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Concerns — Adviser Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/adviser-student-concerns.css">
</head>
<body data-page-title="Student Concerns" data-page-subtitle="View & respond to advisee concerns">
<script>if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark-mode")</script>
    <div id="sidebar-container"></div>
    <div class="main-content" id="mainContent">
        <div id="topbar-container"></div>
        <div class="page-body">
            <h2 class="page-title"><i class="bi bi-chat-left-text-fill"></i> Student Concerns</h2>
            <p class="page-subtitle">Review and respond to academic concerns submitted by your advisees.</p>
            <div class="summary-row">
                <div class="summary-chip"><span class="chip-count amber">0</span> New</div>
                <div class="summary-chip"><span class="chip-count blue">0</span> Active</div>
                <div class="summary-chip"><span class="chip-count green">0</span> Resolved</div>
            </div>
            <div class="filter-row">
                <div class="filter-chip active" onclick="filterConcerns(this,'all')">All</div>
                <div class="filter-chip" onclick="filterConcerns(this,'new')">New</div>
                <div class="filter-chip" onclick="filterConcerns(this,'active')">Active</div>
                <div class="filter-chip" onclick="filterConcerns(this,'resolved')">Resolved</div>
            </div>
            <div id="concernsContainer">
                <div class="empty-state">Loading...</div>
            </div>
            <div id="concernsPagination" class="pagination-bar"></div>

            <!-- Thread Modal -->
            <div class="thread-modal-overlay" id="threadModal">
                <div class="thread-modal">
                    <div class="thread-header">
                        <div class="thread-header-info">
                            <div class="thread-header-name" id="threadStudentName"></div>
                            <div class="thread-header-subject" id="threadSubject"></div>
                        </div>
                        <div class="thread-header-actions">
                            <span id="threadStatus" class="concern-status"></span>
                            <button class="thread-close" onclick="closeThread()"><i class="bi bi-x-lg"></i></button>
                        </div>
                    </div>
                    <div class="thread-messages" id="threadMessages"></div>
                    <div class="thread-compose" id="threadCompose"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/load-components.js"></script>
    <script src="js/adviser-student-concerns.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
