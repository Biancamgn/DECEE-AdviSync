<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Advisees — Adviser Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/my-advisees.css">
</head>
<body data-page-title="My Advisees" data-page-subtitle="Manage your assigned students">
<script>if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark-mode")</script>
    <div id="sidebar-container"></div>
    <div class="main-content" id="mainContent">
        <div id="topbar-container"></div>
        <div class="page-body">
            <h2 class="page-title"><i class="bi bi-people-fill"></i> My Advisees</h2>
            <p class="page-subtitle">View and manage all students assigned to you for academic advising.</p>
            <div class="summary-row">
                <div class="summary-chip"><span class="chip-count chip-total">0</span> Total Advisees</div>
                <div class="summary-chip"><span class="chip-count chip-cleared">0</span> Cleared</div>
                <div class="summary-chip warn"><span class="chip-count chip-pending">0</span> Pending</div>
                <div class="summary-chip danger"><span class="chip-count chip-risk">0</span> At-Risk</div>
            </div>
            <div class="filter-bar">
                <div class="search-box"><i class="bi bi-search"></i><input type="text" placeholder="Search by name, ID, or email..." id="searchInput" oninput="filterTable()"></div>
                <select class="filter-select" id="filterProgram" onchange="filterTable()"><option value="all">All Programs</option><option value="cpe">BS-CpE</option><option value="ece">BS-ECE</option><option value="ee">BS-EE</option></select>
                <select class="filter-select" id="filterStatus" onchange="filterTable()"><option value="all">All Status</option><option value="cleared">Cleared</option><option value="pending">Pending</option><option value="at-risk">At-Risk</option></select>
            </div>
            <table class="advisee-table" id="adviseeTable">
                <thead><tr><th>Student</th><th>ID</th><th>Program</th><th>Term</th><th>Failed Units</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                    <tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--dlsu-gray-400);">Loading advisees...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/load-components.js"></script>
    <script src="../js/my-advisees.js"></script>
    <script src="../js/notifications.js"></script>
</body>
</html>
