<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase Connection</title>
</head>
<body>
    <h1>Testing Supabase Connection</h1>
    <div id="output"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        async function testConnection() {
            const output = document.getElementById('output');
            output.innerHTML = 'Testing connection...<br>';

            try {
                console.log('Supabase client:', supabaseClient);

                const { data, error } = await supabaseClient
                    .from('courses')
                    .select('*')
                    .limit(5);

                console.log('Response:', { data, error });

                if (error) {
                    output.innerHTML += '❌ Error: ' + JSON.stringify(error) + '<br>';
                } else {
                    output.innerHTML += '✅ Success! Found ' + data.length + ' courses<br>';
                    if (data.length > 0) {
                        output.innerHTML += '<h3>First course:</h3><pre>' + JSON.stringify(data[0], null, 2) + '</pre>';
                    }
                }
            } catch (err) {
                output.innerHTML += '❌ Exception: ' + err.message + '<br>';
                console.error('Exception:', err);
            }
        }

        testConnection();
    </script>
</body>
</html>
