<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile — AdviSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page-body {
            max-width: 900px;
            margin: 0 auto;
        }
        .profile-hero {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .profile-avatar-lg {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--dlsu-green);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            flex-shrink: 0;
            border: 4px solid var(--dlsu-green-light);
        }
        .profile-hero-info h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dlsu-gray-800);
            margin-bottom: 0.15rem;
        }
        .profile-hero-info .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            background: var(--dlsu-green-light);
            color: var(--dlsu-green);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .profile-hero-info .id-text {
            font-size: 0.82rem;
            color: var(--dlsu-gray-400);
            margin-top: 0.25rem;
        }
        .section-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--dlsu-gray-200);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .section-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-card-title i {
            color: var(--dlsu-green);
            font-size: 1rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 0.85rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-label-custom {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--dlsu-gray-600);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .form-control-custom {
            width: 100%;
            padding: 0.55rem 0.85rem;
            border: 1px solid var(--dlsu-gray-200);
            border-radius: 8px;
            font-size: 0.82rem;
            font-family: inherit;
            color: var(--dlsu-gray-800);
            background: white;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
            outline: none;
        }
        .form-control-custom:focus {
            border-color: var(--dlsu-green);
            box-shadow: 0 0 0 3px var(--dlsu-green-light);
        }
        .form-control-custom:disabled {
            background: var(--dlsu-gray-50);
            color: var(--dlsu-gray-400);
            cursor: not-allowed;
        }
        .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.5rem;
            background: var(--dlsu-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-save:hover {
            background: var(--dlsu-green-dark);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.25rem;
            background: white;
            color: var(--dlsu-gray-600);
            border: 1px solid var(--dlsu-gray-200);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        .btn-group-right {
            display: flex;
            gap: 0.65rem;
            justify-content: flex-end;
            margin-top: 1.25rem;
        }
        .toast-notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--dlsu-green);
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 0.5rem;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0, 112, 60, 0.3);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @media (max-width: 575.98px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .profile-hero {
                flex-direction: column;
                text-align: center;
            }
        }
        /* Dark Mode */
        body.dark-mode .section-card {
            background: #1a1a1a;
            border-color: #2a2a2a;
        }
        body.dark-mode .section-card-title {
            color: #e8e8e8;
        }
        body.dark-mode .form-label-custom {
            color: #6b6b6b;
        }
        body.dark-mode .form-control-custom {
            background: #1e1e1e;
            border-color: #333;
            color: #e8e8e8;
        }
        body.dark-mode .form-control-custom:disabled {
            background: #121212;
            color: #6b6b6b;
        }
        body.dark-mode .form-control-custom:focus {
            box-shadow: 0 0 0 3px rgba(0, 112, 60, 0.2);
        }
        body.dark-mode .profile-hero-info h2 {
            color: #e8e8e8;
        }
        body.dark-mode .profile-hero-info .id-text {
            color: #6b6b6b;
        }
        body.dark-mode .profile-hero-info .role-badge {
            background: #1a3a28;
        }
        body.dark-mode .profile-avatar-lg {
            border-color: #0d3d1f;
        }
        body.dark-mode .btn-secondary {
            background: #1e1e1e;
            border-color: #333;
            color: #a0a0a0;
        }
        body.dark-mode .btn-secondary:hover {
            border-color: #444;
            color: #e8e8e8;
        }
    </style>
</head>
<body>
<script>if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark-mode")</script>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="brand-text"><h6>AdviSync</h6><small>Admin Panel</small></div>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section-label">Main</div><div class="nav-divider"></div>
            <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i><span class="link-text">Dashboard</span></a>
            <a href="admin-users.html" class="nav-link"><i class="bi bi-people"></i><span class="link-text">User Management</span></a>
            <div class="nav-section-label">Data</div><div class="nav-divider"></div>
            <a href="admin-curriculum.html" class="nav-link"><i class="bi bi-journal-code"></i><span class="link-text">Curriculum</span></a>
            <a href="admin-advising.html" class="nav-link"><i class="bi bi-person-check"></i><span class="link-text">Advising</span></a>
            <a href="admin-reports.html" class="nav-link"><i class="bi bi-bar-chart-line"></i><span class="link-text">Reports</span></a>
            <a href="admin-bulk.html" class="nav-link"><i class="bi bi-gear-wide-connected"></i><span class="link-text">Bulk Tools</span></a>
            <div class="nav-section-label">Account</div><div class="nav-divider"></div>
            <a href="admin-profile.html" class="nav-link active"><i class="bi bi-person"></i><span class="link-text">Profile</span></a>
            <a href="admin-settings.html" class="nav-link"><i class="bi bi-gear"></i><span class="link-text">Settings</span></a>
        </div>
        <div class="sidebar-footer"><div class="user-card"><div class="avatar">—</div><div class="user-info"><div class="user-name">Loading...</div><div class="user-id">—</div></div></div></div>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main-content" id="mainContent">
        <header class="topbar">
            <div class="d-flex align-items-center">
                <button class="hamburger-btn" id="hamburgerBtn"><i class="bi bi-list"></i></button>
                <div class="topbar-left"><h1>Admin Profile</h1><p id="topbarClock"></p></div>
            </div>
            <div class="topbar-right">
                <button class="topbar-circle-btn" id="darkModeBtn" title="Toggle Dark Mode">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <button class="topbar-circle-btn" title="Notifications" id="notifBtn">
                    <i class="bi bi-bell-fill"></i>
                    <span class="notif-badge">0</span>
                </button>
                <div class="profile-wrapper" id="profileWrapper">
                    <div class="d-flex align-items-center gap-1" style="cursor:pointer;" id="profileToggle">
                        <div class="profile-btn">—</div>
                        <i class="bi bi-chevron-down profile-chevron"></i>
                    </div>
                    <div class="profile-dropdown">
                        <div class="dropdown-header"><div class="dropdown-avatar">—</div><div><div class="dropdown-name">Loading...</div><div class="dropdown-role">Administrator</div></div></div>
                        <div class="dropdown-info">
                            <div class="dropdown-info-row"><span class="dropdown-info-label">Department</span><span class="dropdown-info-value">—</span></div>
                            <div class="dropdown-info-row"><span class="dropdown-info-label">College</span><span class="dropdown-info-value">—</span></div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a href="admin-profile.html" class="dropdown-action"><i class="bi bi-person"></i> Profile</a>
                        <a href="admin-settings.html" class="dropdown-action"><i class="bi bi-gear"></i> Settings</a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-action logout" onclick="signOut()"><i class="bi bi-box-arrow-left"></i> Sign out</button>
                    </div>
                </div>
            </div>
        </header>
        <div class="page-body">
            <div class="profile-hero">
                <div class="profile-avatar-lg">—</div>
                <div class="profile-hero-info">
                    <h2>Loading...</h2>
                    <span class="role-badge"><i class="bi bi-shield-check"></i> Admin</span>
                    <div class="id-text">Loading...</div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-person-vcard"></i> Account Information</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Display Name</label><input type="text" class="form-control-custom" value=""></div>
                    <div class="form-group"><label class="form-label-custom">Admin Role</label><input type="text" class="form-control-custom" value="" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Email Address</label><input type="email" class="form-control-custom" value=""></div>
                    <div class="form-group"><label class="form-label-custom">Phone Number</label><input type="tel" class="form-control-custom" value=""></div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-building"></i> Department Information</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Department</label><input type="text" class="form-control-custom" value="" disabled></div>
                    <div class="form-group"><label class="form-label-custom">College</label><input type="text" class="form-control-custom" value="" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Total Students</label><input type="text" class="form-control-custom" value="—" disabled></div>
                    <div class="form-group"><label class="form-label-custom">Total Advisers</label><input type="text" class="form-control-custom" value="—" disabled></div>
                </div>
            </div>
            <div class="btn-group-right">
                <button class="btn-secondary" onclick="location.reload()"><i class="bi bi-arrow-counterclockwise"></i> Discard</button>
                <button class="btn-save" onclick="showToast('Profile saved successfully!')"><i class="bi bi-check-lg"></i> Save Changes</button>
            </div>
        </div>
    </div>
    <div class="toast-notification" id="toast"><i class="bi bi-check-circle-fill"></i> <span id="toastMsg"></span></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/script.js"></script>
    <script>
        function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMsg').textContent = msg; t.style.display = 'flex'; setTimeout(() => t.style.display = 'none', 3000); }

        (async function() {
            const profile = await requireAuth(['admin']);
            if (!profile) return;

            const fullName = (profile.first_name || '') + ' ' + (profile.last_name || '');
            const initials = (profile.first_name?.[0] || '') + (profile.last_name?.[0] || '');

            // Update hero section
            document.querySelector('.profile-avatar-lg').textContent = initials;
            document.querySelector('.profile-hero-info h2').textContent = fullName || 'Admin';
            document.querySelector('.profile-hero-info .id-text').textContent = 'DECEE Department · De La Salle University';

            // Update sidebar footer
            const sidebarAvatar = document.querySelector('.sidebar-footer .avatar');
            const sidebarName = document.querySelector('.sidebar-footer .user-name');
            if (sidebarAvatar) sidebarAvatar.textContent = initials;
            if (sidebarName) sidebarName.textContent = fullName;

            // Update topbar
            document.querySelectorAll('.profile-btn').forEach(el => el.textContent = initials);
            document.querySelectorAll('.dropdown-avatar').forEach(el => el.textContent = initials);
            document.querySelectorAll('.dropdown-name').forEach(el => el.textContent = fullName);

            // Populate form fields
            const inputs = document.querySelectorAll('.form-control-custom');
            inputs[0].value = fullName;                         // Display Name
            inputs[2].value = profile.email || '';               // Email
            inputs[3].value = profile.phone || '';               // Phone

            // Fetch stats
            const [studentsRes, advisersRes] = await Promise.all([
                supabaseClient.from('students').select('id', { count: 'exact', head: true }),
                supabaseClient.from('profiles').select('id', { count: 'exact', head: true }).eq('role', 'adviser')
            ]);
            inputs[6].value = (studentsRes.count || 0) + ' active students';
            inputs[7].value = (advisersRes.count || 0) + ' advisers';

            // Wire save button
            document.querySelector('.btn-save').onclick = async function() {
                const displayName = inputs[0].value.trim();
                const parts = displayName.split(' ');
                const firstName = parts[0] || '';
                const lastName = parts.slice(1).join(' ') || '';
                const { error } = await supabaseClient.from('profiles').update({
                    first_name: firstName,
                    last_name: lastName,
                    email: inputs[2].value.trim(),
                    phone: inputs[3].value.trim()
                }).eq('id', profile.id);
                showToast(error ? 'Error: ' + error.message : 'Profile saved successfully!');
            };
        })();
    </script>
    <script src="../js/notifications.js"></script>
</body>
</html>
