<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test</title>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://zbbqhhryogeahttzygyu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiYnFoaHJ5b2dlYWh0dHp5Z3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODUwNzIsImV4cCI6MjA5MDU2MTA3Mn0.YYAMTmh9Ee1ivjt3zAQhnUC2LNWXDbqtks9kqQm-lXw';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testConnection() {
            const resultDiv = document.getElementById('result');

            try {
                // Test 1: Basic connection
                resultDiv.innerHTML += '<p>🔄 Testing basic connection...</p>';

                // Test auth status
                const { data: { session }, error: authError } = await supabaseClient.auth.getSession();
                resultDiv.innerHTML += `<p>🔐 Auth status: ${session ? 'Logged in as ' + session.user.email : 'Not logged in'}</p>`;
                if (authError) {
                    resultDiv.innerHTML += `<p>⚠️ Auth error: ${authError.message}</p>`;
                }

                // Test 2: Check courses table with detailed logging
                resultDiv.innerHTML += '<p>🔄 Testing courses table access...</p>';

                const { data: courses, error } = await supabaseClient
                    .from('courses')
                    .select('*')
                    .limit(10);

                console.log('Courses query result:', { courses, error });

                if (error) {
                    resultDiv.innerHTML += `<p>❌ Error accessing courses table: ${error.message}</p>`;
                    resultDiv.innerHTML += `<p>Error details: ${JSON.stringify(error)}</p>`;
                    return;
                }

                resultDiv.innerHTML += `<p>✅ Supabase connection successful!</p>`;
                resultDiv.innerHTML += `<p>📊 Found ${courses.length} courses in database</p>`;

                if (courses.length > 0) {
                    resultDiv.innerHTML += `<p>📝 Sample course data:</p>`;
                    resultDiv.innerHTML += `<pre>${JSON.stringify(courses[0], null, 2)}</pre>`;

                    // Check program codes
                    const programCodes = [...new Set(courses.map(c => c.program_code))];
                    resultDiv.innerHTML += `<p>🎓 Program codes found: ${programCodes.join(', ')}</p>`;

                    // Count by program
                    const bscpeCount = courses.filter(c => c.program_code === 'BSCpE').length;
                    const bseceCount = courses.filter(c => c.program_code === 'BSECE').length;
                    resultDiv.innerHTML += `<p>📈 BSCpE courses: ${bscpeCount}, BSECE courses: ${bseceCount}</p>`;
                } else {
                    resultDiv.innerHTML += `<p>⚠️ No courses found in database</p>`;
                }

                // Test 3: Check courses table
                const { data: curriculum, error: currError } = await supabaseClient
                    .from('courses')
                    .select('*')
                    .limit(1);

                if (currError) {
                    resultDiv.innerHTML += `<p>⚠️ courses table not accessible: ${currError.message}</p>`;
                } else {
                    resultDiv.innerHTML += `<p>✅ courses table accessible (${curriculum.length} records found)</p>`;
                }

            } catch (err) {
                resultDiv.innerHTML += `<p>❌ Connection failed: ${err.message}</p>`;
            }
        }

        // Run test when page loads
        testConnection();
    </script>
</body>
</html>
