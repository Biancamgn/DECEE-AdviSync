<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Adviser Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/adviser-profile.css">
</head>
<body data-page-title="My Profile" data-page-subtitle="Adviser Portal">
<script>if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark-mode")</script>
    <div id="sidebar-container"></div>
    <div class="main-content" id="mainContent">
        <div id="topbar-container"></div>
        <div class="page-body">
            <div class="profile-hero">
                <div class="profile-avatar-lg dropdown-avatar">--</div>
                <div class="profile-hero-info">
                    <h2 class="dropdown-name">Loading...</h2>
                    <span class="role-badge"><i class="bi bi-person-workspace"></i> Academic Adviser</span>
                    <div class="id-text">DECEE · Computer Engineering Program</div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-person-vcard"></i> Personal Information</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">First Name</label><input type="text" class="form-control-custom" id="profileFirstName"></div>
                    <div class="form-group"><label class="form-label-custom">Last Name</label><input type="text" class="form-control-custom" id="profileLastName"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Title</label>
                        <select class="form-control-custom" id="profileTitle">
                            <option value="Dr.">Dr.</option>
                            <option value="Prof.">Prof.</option>
                            <option value="Engr.">Engr.</option>
                            <option value="Mr.">Mr.</option>
                            <option value="Ms.">Ms.</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label-custom">Email Address</label><input type="email" class="form-control-custom" id="profileEmail"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Phone Number</label><input type="tel" class="form-control-custom" id="profilePhone" placeholder="+63 9XX XXX XXXX"></div>
                    <div class="form-group"><label class="form-label-custom">Office Location</label><input type="text" class="form-control-custom" id="profileOffice" placeholder="e.g. Gokongwei Hall G302"></div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-building"></i> Academic Information</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Department</label><input type="text" class="form-control-custom" value="DECEE" disabled></div>
                    <div class="form-group"><label class="form-label-custom">College</label><input type="text" class="form-control-custom" value="Gokongwei College of Engineering" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Program</label><input type="text" class="form-control-custom" value="BS Computer Engineering" disabled></div>
                    <div class="form-group"><label class="form-label-custom">Total Advisees</label><input type="text" class="form-control-custom" id="profileTotalAdvisees" value="—" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Specialization</label><input type="text" class="form-control-custom" id="profileSpecialization" placeholder="e.g. Embedded Systems & IoT"></div>
                    <div class="form-group"><label class="form-label-custom">Years of Service</label><input type="text" class="form-control-custom" id="profileYearsService" placeholder="e.g. 12 years"></div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-clock"></i> Office Hours</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Monday</label><input type="text" class="form-control-custom" id="profileMonHours" placeholder="e.g. 9:00 AM – 12:00 PM"></div>
                    <div class="form-group"><label class="form-label-custom">Wednesday</label><input type="text" class="form-control-custom" id="profileWedHours" placeholder="e.g. 1:00 PM – 4:00 PM"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Friday</label><input type="text" class="form-control-custom" id="profileFriHours" placeholder="e.g. 9:00 AM – 11:00 AM"></div>
                    <div class="form-group"><label class="form-label-custom">Consultation Mode</label>
                        <select class="form-control-custom" id="profileConsultMode">
                            <option>In-Person & Online</option>
                            <option>In-Person Only</option>
                            <option>Online Only</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="btn-group-right">
                <button class="btn-secondary" onclick="location.reload()"><i class="bi bi-arrow-counterclockwise"></i> Discard</button>
                <button class="btn-save" onclick="saveProfile()"><i class="bi bi-check-lg"></i> Save Changes</button>
            </div>
        </div>
    </div>
    <div class="toast-notification" id="toast"><i class="bi bi-check-circle-fill"></i> <span id="toastMsg"></span></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/load-components.js"></script>
    <script src="js/adviser-profile.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
