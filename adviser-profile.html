<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Adviser Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/adviser-profile.css">
</head>
<body data-page-title="My Profile" data-page-subtitle="Adviser Portal">
<script>if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark-mode")</script>
    <div id="sidebar-container"></div>
    <div class="main-content" id="mainContent">
        <div id="topbar-container"></div>
        <div class="page-body">
            <div class="profile-hero">
                <div class="profile-avatar-lg dropdown-avatar">--</div>
                <div class="profile-hero-info">
                    <h2 class="dropdown-name">Loading...</h2>
                    <span class="role-badge"><i class="bi bi-person-workspace"></i> Academic Adviser</span>
                    <div class="id-text">DECEE · Computer Engineering Program</div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-person-vcard"></i> Personal Information</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">First Name</label><input type="text" class="form-control-custom" id="profileFirstName" value=""></div>
                    <div class="form-group"><label class="form-label-custom">Last Name</label><input type="text" class="form-control-custom" id="profileLastName" value=""></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Title</label><select class="form-control-custom" id="profileTitle"><option value="dr">Dr.</option><option value="prof">Prof.</option><option value="engr">Engr.</option><option value="mr">Mr.</option><option value="ms">Ms.</option></select></div>
                    <div class="form-group"><label class="form-label-custom">Email Address</label><input type="email" class="form-control-custom" id="profileEmail" value=""></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Phone Number</label><input type="tel" class="form-control-custom" id="profilePhone" value=""></div>
                    <div class="form-group"><label class="form-label-custom">Office Location</label><input type="text" class="form-control-custom" id="profileOffice" value=""></div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-building"></i> Academic Information</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Department</label><input type="text" class="form-control-custom" id="profileDept" value="" disabled></div>
                    <div class="form-group"><label class="form-label-custom">College</label><input type="text" class="form-control-custom" value="Gokongwei College of Engineering" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Program</label><input type="text" class="form-control-custom" id="profileProgram" value="" disabled></div>
                    <div class="form-group"><label class="form-label-custom">Total Advisees</label><input type="text" class="form-control-custom" id="profileAdvisees" value="" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Specialization</label><input type="text" class="form-control-custom" id="profileSpec" value=""></div>
                    <div class="form-group"><label class="form-label-custom">Years of Service</label><input type="text" class="form-control-custom" id="profileYears" value=""></div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-card-title"><i class="bi bi-clock"></i> Office Hours</div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Monday</label><input type="text" class="form-control-custom" id="officeMonday" value=""></div>
                    <div class="form-group"><label class="form-label-custom">Wednesday</label><input type="text" class="form-control-custom" id="officeWednesday" value=""></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label-custom">Friday</label><input type="text" class="form-control-custom" id="officeFriday" value=""></div>
                    <div class="form-group"><label class="form-label-custom">Consultation Mode</label><select class="form-control-custom" id="consultMode"><option>In-Person & Online</option><option>In-Person Only</option><option>Online Only</option></select></div>
                </div>
            </div>
            <div class="btn-group-right">
                <button class="btn-secondary" onclick="location.reload()"><i class="bi bi-arrow-counterclockwise"></i> Discard</button>
                <button class="btn-save" onclick="saveProfile()"><i class="bi bi-check-lg"></i> Save Changes</button>
            </div>
        </div>
    </div>
    <div class="toast-notification" id="toast"><i class="bi bi-check-circle-fill"></i> <span id="toastMsg"></span></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/load-components.js"></script>
    <script>
        function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMsg').textContent = msg; t.style.display = 'flex'; setTimeout(() => t.style.display = 'none', 3000); }

        let currentProfile = null;
        let currentProf = null;

        async function saveProfile() {
            if (!currentProfile) return;
            const uid = currentProfile.id;
            const firstName = document.getElementById('profileFirstName').value.trim();
            const lastName = document.getElementById('profileLastName').value.trim();
            const title = document.getElementById('profileTitle').value;
            const phone = document.getElementById('profilePhone').value.trim();
            const office = document.getElementById('profileOffice').value.trim();
            const spec = document.getElementById('profileSpec').value.trim();

            const { error: pErr } = await supabaseClient.from('profiles').update({ first_name: firstName, last_name: lastName }).eq('id', uid);
            if (pErr) { showToast('Failed to save profile.'); return; }

            const { error: profErr } = await supabaseClient.from('professors').update({
                phone_number: phone || null,
                office_location: office || null,
                specialization: spec || null
            }).eq('id', uid);
            if (profErr) { showToast('Failed to save professor info.'); return; }

            showToast('Profile saved successfully!');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const profile = await loadUserProfile();
            if (!profile) return;
            currentProfile = profile;

            const fn = document.getElementById('profileFirstName');
            const ln = document.getElementById('profileLastName');
            const em = document.getElementById('profileEmail');
            if (fn) fn.value = profile.first_name || '';
            if (ln) ln.value = profile.last_name || '';
            if (em) em.value = profile.email || '';

            // Set title dropdown
            const titleSel = document.getElementById('profileTitle');
            if (titleSel && profile.first_name) {
                // Try to match from name prefix if available
            }

            // Fetch professor details
            const { data: prof } = await supabaseClient.from('professors').select('*').eq('id', profile.id).single();
            if (prof) {
                currentProf = prof;
                const phone = document.getElementById('profilePhone');
                const office = document.getElementById('profileOffice');
                const dept = document.getElementById('profileDept');
                const spec = document.getElementById('profileSpec');
                if (phone) phone.value = prof.phone_number || '';
                if (office) office.value = prof.office_location || '';
                if (dept) dept.value = prof.department || '';
                if (spec) spec.value = prof.specialization || '';
            }

            // Fetch advisee count
            const { count } = await supabaseClient.from('students').select('id', { count: 'exact', head: true }).eq('adviser_id', profile.id);
            const adviseesField = document.getElementById('profileAdvisees');
            if (adviseesField) adviseesField.value = (count || 0) + ' students';

            // Set program (from profile or default)
            const programField = document.getElementById('profileProgram');
            if (programField) programField.value = profile.program || 'BS Computer Engineering';
        });
    </script>
    <script src="js/notifications.js"></script>
</body>
</html>
