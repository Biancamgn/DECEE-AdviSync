<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECEE AdviSync - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dlsu-bg"> <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4 login-card" style="width: 100%; max-width: 400px; border-radius: 15px;">
            <div class="text-center mb-4">
                <img src="assets/images/website-logo.png" alt="DECEE AdviSync Logo" class="img-fluid-mb-2" style="max-height: 80px;">
                
                <h4 class="fw-bold text-success">DECEE AdviSync</h4>
                <p class="text-muted">Sign in with your DLSU ID</p>
                

            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="studentId" class="form-label fw-semibold">ID Number</label>
                    <input type="text" class="form-control" id="studentId" placeholder="e.g. 12345678" 
                           pattern="[0-9]{8}" maxlength="8" minlength="8" required 
                           title="Please enter exactly 8 digits.">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye-slash" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success fw-bold">Sign In</button>
                    <button type="button" class="btn btn-link text-decoration-none text-success text-sm" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                        Forgot Password?
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="forgotPasswordModalLabel">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Enter your ID number. Password reset instructions will be sent to your DLSU email.</p>
                    
                    <div id="resetAlert" class="alert alert-success d-none" role="alert">
                        Reset instructions have been sent to your email.
                    </div>

                    <form id="forgotPasswordForm">
                        <div class="mb-3">
                            <label for="resetId" class="form-label fw-semibold">ID Number</label>
                            <input type="text" class="form-control" id="resetId" placeholder="e.g. 12345678" 
                                   pattern="[0-9]{8}" maxlength="8" minlength="8" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Send Reset Link</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
