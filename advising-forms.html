<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advising Forms — Adviser Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/advising-forms.css">
</head>
<body data-page-title="Advising Forms" data-page-subtitle="Review student academic advising form submissions">
<script>if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark-mode")</script>
    <div id="sidebar-container"></div>
    <div class="main-content" id="mainContent">
        <div id="topbar-container"></div>
        <div class="page-body">
            <h2 class="page-title"><i class="bi bi-file-earmark-check-fill"></i> Advising Forms</h2>
            <p class="page-subtitle">Review, approve, or request revisions on student academic advising form submissions.</p>
            <div class="tab-bar">
                <div class="tab-item active" onclick="switchTab('pending')">Pending <span class="tab-count">0</span></div>
                <div class="tab-item" onclick="switchTab('approved')">Approved <span class="tab-count">0</span></div>
                <div class="tab-item" onclick="switchTab('rejected')">Rejected <span class="tab-count">0</span></div>
            </div>
            <div class="tab-content" id="tab-pending">
                <div class="empty-state">Loading...</div>
            </div>
            <div class="tab-content" id="tab-approved" style="display:none;">
                <div class="empty-state">Loading...</div>
            </div>
            <div class="tab-content" id="tab-rejected" style="display:none;">
                <div class="empty-state">Loading...</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/load-components.js"></script>
    <script src="js/advising-forms.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
